name: Release
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set correct versions
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION:1} # Remove v prefix
          VERSION=${VERSION%.*} # Remove minor version
          sed "s/edge/$VERSION/" -i docker-compose.yml

      - name: Upload artifacts to draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: |
            ./docker-compose.yml
            ./.env.example

  native:
    name: Build Android ${{ matrix.tv && 'TV' || 'phone' }} APK
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        tv: [false, true]
    uses: ./.github/workflows/android-build.yml
    with:
      variant: release
      tv: ${{ matrix.tv }}
      attach-to-release: true
      release-tag: ${{ github.ref_name }}
    secrets: inherit

  play:
    name: Publish to Google Play
    uses: ./.github/workflows/android-play.yml
    with:
      tracks: production
      version-name: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [draft, native, play]
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false --repo ${{ github.repository }}
