name: HurlTests
on:
  push:
    branches:
      - master
      - next
  pull_request:


jobs:
  test:
    name: Hurl tests Auth
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: kyoo
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '^1.26.0'
          cache-dependency-path: ./auth/go.sum

      - name: Install dependencies
        working-directory: ./auth
        run: |
          go mod download

      - name: Build
        working-directory: ./auth
        run: |
          go build -o ./keibi

      - name: Run hurl tests
        working-directory: ./auth
        run: |
          ./keibi > logs &
          wget --retry-connrefused --retry-on-http-error=502 http://localhost:4568/auth/health
          docker run --rm --network host -v "$PWD:$PWD" -w "$PWD" "ghcr.io/orange-opensource/hurl:$HURL_VERSION" \
            --error-format long --variable host=http://localhost:4568/auth tests/*
        env:
          # renovate: datasource=docker depName=ghcr.io/orange-opensource/hurl
          HURL_VERSION: 8.0.1
          PGHOST: localhost
          PGUSER: kyoo
          PGPASSWORD: password
          FIRST_USER_CLAIMS: '{"permissions": ["users.read"]}'
          KEIBI_APIKEY_HURL: 1234apikey
          KEIBI_APIKEY_HURL_CLAIMS: '{"permissions": ["apikeys.write", "apikeys.read"]}'
          KEIBI_APIKEY_LAZY: lazy
          KEIBI_APIKEY_LAZY_CLAIMS: '{"permissions": ["apikeys.read"]}'


      - name: Show logs
        if: failure()
        working-directory: ./auth
        run: cat logs

